plugins {
    id 'com.android.application'
}

def appVersionCode = project.findProperty('APP_VERSION_CODE') ?: '1'
def appVersionName = project.findProperty('APP_VERSION_NAME') ?: '1.0.0'

android {
    namespace 'com.oasisinfobyte.calculator'
    compileSdk 36

    defaultConfig {
        applicationId 'com.oasisinfobyte.calculator'
        minSdk 23
        targetSdk 35
        versionCode appVersionCode.toString().toInteger()
        versionName appVersionName.toString()
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def signingStore = System.getenv('ANDROID_KEYSTORE_PATH')
            if (signingStore) {
                storeFile file(signingStore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

