<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oasis Calculator — UI Preview</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e9eaf0; color: #171a27; }
    .phone { width: min(390px, 100vw); height: min(844px, 100vh); min-height: 650px; padding: 0 20px 22px; display: flex; flex-direction: column; overflow: hidden; background: #f5f6fa; border: 1px solid #d9dbe4; border-radius: 34px; box-shadow: 0 28px 70px #26304b2b; }
    .status { height: 48px; flex: 0 0 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; color: #25283a; font-size: 13px; font-weight: 650; }
    .status-icons { font-size: 12px; letter-spacing: 1px; }
    .brand { margin-top: 12px; color: #73788b; font-size: 11px; font-weight: 700; letter-spacing: 1.7px; }
    .expression { min-height: 0; flex: 1; display: flex; align-items: end; justify-content: end; padding: 0 2px 10px; overflow: hidden; color: #73788b; font-size: 23px; white-space: nowrap; }
    .result { min-height: 80px; display: flex; align-items: center; justify-content: end; padding: 0 2px 20px; color: #171a27; font-size: 52px; font-weight: 400; letter-spacing: -2px; }
    .keys { flex: 0 0 58%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); gap: 10px; }
    .key { display: grid; place-items: center; border-radius: 18px; background: #fff; color: #202337; font-size: 22px; box-shadow: 0 2px 5px #22283a0b; }
    .utility { background: #e8eaf2; color: #555b75; font-size: 18px; }
    .operator { background: #e4e5ff; color: #4145b6; }
    .equals { background: #5b5ce2; color: white; box-shadow: 0 5px 12px #5b5ce238; }
    .nav-handle { width: 108px; height: 4px; margin: 16px auto 0; flex: 0 0 4px; border-radius: 99px; background: #c8cad3; }
    @media (max-height: 720px) { .phone { min-height: 0; border-radius: 0; } .keys { flex-basis: 62%; gap: 7px; } }
  </style>
</head>
<body>
  <main class="phone" aria-label="Oasis Calculator app visual preview">
    <div class="status"><span>9:41</span><span class="status-icons">5G &nbsp; 92%</span></div>
    <div class="brand">OASIS&nbsp; / &nbsp;CALCULATOR</div>
    <div class="expression">8 + 2 × 3</div>
    <div class="result">14</div>
    <section class="keys" aria-label="Calculator keypad">
      <div class="key utility">C</div><div class="key utility">DEL</div><div class="key utility">±</div><div class="key operator">÷</div>
      <div class="key">7</div><div class="key">8</div><div class="key">9</div><div class="key operator">×</div>
      <div class="key">4</div><div class="key">5</div><div class="key">6</div><div class="key operator">−</div>
      <div class="key">1</div><div class="key">2</div><div class="key">3</div><div class="key operator">+</div>
      <div class="key utility">%</div><div class="key">0</div><div class="key">.</div><div class="key equals">=</div>
    </section>
    <div class="nav-handle"></div>
  </main>
</body>
</html>
