<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5fa">
  <title>Oasis Calculator — UI Preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #e9eaf0; font: 14px/1.5 "Segoe UI", Arial, sans-serif; }
    main { width: min(430px, 100%); padding: 12px; border: 1px solid #d9dbe4; border-radius: 38px; background: #f4f5fa; box-shadow: 0 28px 70px #26304b2b; }
    img { display: block; width: 100%; height: auto; }
    nav { display: flex; justify-content: center; gap: 12px; margin: 14px 0 4px; }
    a { padding: 8px 13px; border-radius: 18px; background: #e5eaf2; color: #30455f; text-decoration: none; font-weight: 600; }
    p { margin: 12px 10px 4px; color: #646b82; text-align: center; }
  </style>
</head>
<body>
  <main>
    <img src="ui-preview.svg" alt="Oasis Calculator preview: light theme, calculation history, memory buttons, square root, square, and copy controls.">
    <nav><a href="ui-preview.svg">Light theme</a><a href="ui-preview-dark.svg">Dark theme</a></nav>
    <p>Android calculator layout preview.</p>
  </main>
</body>
</html>
