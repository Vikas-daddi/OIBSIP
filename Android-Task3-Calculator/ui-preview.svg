<svg xmlns="http://www.w3.org/2000/svg" width="430" height="900" viewBox="0 0 430 900" role="img" aria-labelledby="title description">
  <title id="title">Oasis Calculator in light theme</title>
  <desc id="description">Calculator concept inspired by the user's reference: compact app bar, large expression card, scientific controls, rounded number keys, coral clear key, and blue operators.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#F8F9FC"/><stop offset="1" stop-color="#EEF1F6"/></linearGradient>
    <linearGradient id="display" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAFBFE"/><stop offset="1" stop-color="#EDF3FB"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#344054" flood-opacity=".09"/></filter>
    <filter id="keyshadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#344054" flood-opacity=".08"/></filter>
  </defs>
  <rect width="430" height="900" rx="38" fill="url(#screen)"/>
  <text x="30" y="36" fill="#202124" font-family="Arial,sans-serif" font-size="14" font-weight="700">11:36</text>
  <text x="345" y="36" fill="#202124" font-family="Arial,sans-serif" font-size="13" font-weight="700">5G  ·  92%</text>
  <rect x="23" y="54" width="30" height="30" rx="9" fill="#585BDE"/>
  <rect x="31" y="59" width="14" height="20" rx="3" fill="#FFFFFF"/>
  <rect x="33" y="62" width="10" height="4" fill="#585BDE"/>
  <path d="M33 69h3v3h-3zm5 0h3v3h-3zm-5 5h3v3h-3zm5 0h3v3h-3z" fill="#585BDE"/>
  <text x="63" y="74" fill="#202124" font-family="Arial,sans-serif" font-size="15" font-weight="700">Oasis Calculator</text>
  <circle cx="349" cy="69" r="20" fill="#E5EAF2"/>
  <text x="349" y="76" text-anchor="middle" fill="#42536B" font-family="Arial,sans-serif" font-size="21">◴</text>
  <circle cx="397" cy="69" r="20" fill="#E5EAF2"/>
  <text x="397" y="76" text-anchor="middle" fill="#42536B" font-family="Arial,sans-serif" font-size="22">☾</text>

  <rect x="22" y="94" width="386" height="230" rx="23" fill="url(#display)" stroke="#E1E6EF" filter="url(#shadow)"/>
  <rect x="38" y="108" width="39" height="21" rx="10.5" fill="#E8EEF7"/>
  <text x="57.5" y="122.5" text-anchor="middle" fill="#475467" font-family="Arial,sans-serif" font-size="10" font-weight="700">DEG</text>
  <text x="384" y="220" text-anchor="end" fill="#202124" font-family="Arial,sans-serif" font-size="30" font-weight="500">12,450 + 3,200</text>
  <text x="384" y="261" text-anchor="end" fill="#69717C" font-family="Arial,sans-serif" font-size="23">15,650</text>
  <path d="M38 278H392" stroke="#E1E6EF"/>
  <rect x="38" y="288" width="126" height="27" rx="13.5" fill="#E7EDF7"/>
  <text x="101" y="306" text-anchor="middle" fill="#30455F" font-family="Arial,sans-serif" font-size="12" font-weight="600">⌄  Scientific</text>
  <text x="382" y="308" text-anchor="end" fill="#42536B" font-family="Arial,sans-serif" font-size="22">⌫</text>

  <g font-family="Arial,sans-serif" font-size="22" text-anchor="middle" filter="url(#keyshadow)">
    <circle cx="64" cy="369" r="34" fill="#FFDAD7"/><text x="64" y="377" fill="#9D292B" font-size="18">AC</text>
    <circle cx="164" cy="369" r="34" fill="#E5EAF2"/><text x="164" y="377" fill="#384352" font-size="19">()</text>
    <circle cx="264" cy="369" r="34" fill="#E5EAF2"/><text x="264" y="377" fill="#384352">%</text>
    <circle cx="364" cy="369" r="34" fill="#D8E7FF"/><text x="364" y="377" fill="#174EA6">÷</text>

    <circle cx="64" cy="453" r="34" fill="#FFFFFF"/><text x="64" y="461" fill="#202124">7</text>
    <circle cx="164" cy="453" r="34" fill="#FFFFFF"/><text x="164" y="461" fill="#202124">8</text>
    <circle cx="264" cy="453" r="34" fill="#FFFFFF"/><text x="264" y="461" fill="#202124">9</text>
    <circle cx="364" cy="453" r="34" fill="#D8E7FF"/><text x="364" y="461" fill="#174EA6">×</text>

    <circle cx="64" cy="537" r="34" fill="#FFFFFF"/><text x="64" y="545" fill="#202124">4</text>
    <circle cx="164" cy="537" r="34" fill="#FFFFFF"/><text x="164" y="545" fill="#202124">5</text>
    <circle cx="264" cy="537" r="34" fill="#FFFFFF"/><text x="264" y="545" fill="#202124">6</text>
    <circle cx="364" cy="537" r="34" fill="#D8E7FF"/><text x="364" y="545" fill="#174EA6">−</text>

    <circle cx="64" cy="621" r="34" fill="#FFFFFF"/><text x="64" y="629" fill="#202124">1</text>
    <circle cx="164" cy="621" r="34" fill="#FFFFFF"/><text x="164" y="629" fill="#202124">2</text>
    <circle cx="264" cy="621" r="34" fill="#FFFFFF"/><text x="264" y="629" fill="#202124">3</text>
    <circle cx="364" cy="621" r="34" fill="#D8E7FF"/><text x="364" y="629" fill="#174EA6">+</text>

    <circle cx="64" cy="705" r="34" fill="#FFFFFF"/><text x="64" y="713" fill="#202124">0</text>
    <circle cx="164" cy="705" r="34" fill="#FFFFFF"/><text x="164" y="713" fill="#202124">.</text>
    <circle cx="264" cy="705" r="34" fill="#E5EAF2"/><text x="264" y="713" fill="#384352" font-size="17">+/−</text>
    <circle cx="364" cy="705" r="34" fill="#0B57D0"/><text x="364" y="713" fill="#FFFFFF" font-weight="700">=</text>
  </g>
  <text x="215" y="866" text-anchor="middle" fill="#A7ABB5" font-family="Arial,sans-serif" font-size="18">—</text>
</svg>
